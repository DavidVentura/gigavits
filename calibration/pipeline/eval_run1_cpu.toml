# CPU variant of eval_run1.toml: the training run holds most of the GPU memory.
threads = 6

[metrics.cer]
model = { hub = "small" }
device = "cpu"
compute_type = "int8"
beam_size = 5

[metrics.lid]
model = { hub = "speechbrain/lang-id-voxlingua107-ecapa" }
device = "cpu"
savedir = "/workspace/evalmodels/lang-id-voxlingua107-ecapa"

[metrics.speaker]
model = { hub = "speechbrain/spkrec-ecapa-voxceleb" }
device = "cpu"
savedir = "/workspace/evalmodels/spkrec-ecapa-voxceleb"
reference_utterances = 10

[metrics.quality]

[metrics.per]
model = { hub = "facebook/wav2vec2-lv-60-espeak-cv-ft" }
device = "cpu"

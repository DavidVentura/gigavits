# Rented GPU box: every metric, models fetched from the Hugging Face hub on first use.
# The phonemizer paths are where the box's checkout and app bucket live; adjust to the box layout.
threads = 8

[phonemizer]
binary = "../../../piper-rs/target/release/phoneme-coverage"
espeak_data = "../../coverage/work/espeak-ng-data"
reference_config = "../../../bucket/tts/1/en/en_US/amy/medium/en_US-amy-medium.onnx.json"
reference_model = "../../../bucket/tts/1/en/en_US/amy/medium/en_US-amy-medium.mnn"

[metrics.cer]
model = { hub = "small" }
device = "cuda"
compute_type = "int8_float16"
beam_size = 5

[metrics.per]
model = { hub = "facebook/wav2vec2-lv-60-espeak-cv-ft" }
device = "cuda"
pair_counts = "../work/pairs.tsv"

[metrics.lid]
model = { hub = "speechbrain/lang-id-voxlingua107-ecapa" }
device = "cuda"
savedir = "../models/speechbrain/lang-id-voxlingua107-ecapa"

[metrics.speaker]
model = { hub = "speechbrain/spkrec-ecapa-voxceleb" }
device = "cuda"
savedir = "../models/speechbrain/spkrec-ecapa-voxceleb"
reference_utterances = 10

[metrics.f0]
fmin_hz = 50
fmax_hz = 600
max_length_mismatch_s = 0.02
min_voiced_frames = 20

[metrics.quality]

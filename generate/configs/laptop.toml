# Laptop test: a few seconds of audio per speaker from six kinds of teacher.

[paths]
root = "../.."
tiers = "voices/tiers.csv"
voice_list = "voices/voice_list.tsv"
kokoro_list = "voices/kokoro_list.tsv"
other_list = "voices/other_list.tsv"
espeak_data = "coverage/work/espeak-ng-data"
teacher_rt = "/home/david/git/piper-rs/target/release/teacher-rt"
kokoro_source_onnx = "/home/david/git/translator-rs/scripts/kokoro_mnn/kokoro-v1.0.onnx"
kokoro_onnx = "generate/out/laptop/kokoro-v1.0.patched.i32.onnx"
kokoro_voices = "/home/david/AndroidStudioProjects/bucket/tts/1/kokoro/voices-v1.0.bin"
regions = "generate/data/regions.tsv"
flores_codes = "generate/data/flores_codes.tsv"
source_catalog = "generate/data/source_catalog.json"
mnn_catalog = "generate/data/mnn_catalog.json"
extra_sources = "generate/data/extra_sources.tsv"
sentences = "generate/sentences"
bucket_in_lists = "/home/david/AndroidStudioProjects/bucket"
bucket = "/home/david/AndroidStudioProjects/bucket"
out = "generate/out/laptop"

[sentences]
train = 2000
held_out = 50
core = 300
min_words = 4
max_words = 25
max_words_by_espeak = { vi = 45 }

[[sentences.source]]
kind = "tsv"
path = "coverage/work/sentences.tsv"

[[sentences.source]]
kind = "flores"
path = "coverage/work/flores200_dataset"

[selection]
voices = [
    "en_GB-alan-medium",          # medium, 22.05 kHz
    "es_ES-carlfm-x_low",         # x_low, 16 kHz
    "es_ES-sharvard-medium",      # multi-speaker (F, M)
    "es_MX-ald-medium",           # slow voice: tempo raised to the Spanish median
    "is_IS-bui-medium",           # old 130-symbol map: lossy teacher input on '#'
    "kokoro-ef_dora",
    "mms-az",
]
# Italian test references are never trained in run 1 (PLAN Speakers); Mandarin is out of run 1.
exclude_voices = ["it_IT-paola-medium", "kokoro-if_sara"]
exclude_speakers = []
exclude_espeak = ["cmn"]

[hours]
lineup = 4.0
lineup_speakers = []
cap_seconds = 20.0

[hours.tier]
good = 1.5
clean_robot = 0.75
natural_degraded = 0.75

[render]
noise = "voice_config"
rate = "raise_slow"
second_render_fraction = 0.2
part_hours = 0.5
seed = 1

[quality]
duration_z = 4.0
min_symbol_count = 30
silence_db = -45.0
silence_frame_s = 0.02
max_internal_silence_s = 1.0
flag_drop_fraction = 0.10

[fetch]
kokoro_url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"

[package]
shard_bytes = 1_000_000_000

[run]
workers = 7
threads_per_worker = 1

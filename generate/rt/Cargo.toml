[package]
name = "teacher-rt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
piper-rs = { path = "../../../piper-rs", default-features = false, features = ["japanese"] }
espeak-rs = { path = "../../../piper-rs/crates/espeak-rs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"
# The converter builds fp32 MNN teachers from the fp32 ONNX files; the app ships int8 weights.
mnn-sys = { git = "https://github.com/DavidVentura/mnn-sys", features = ["converter"] }
